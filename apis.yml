aid: chaos
name: Chaos
description: >-
  CHAOS Industries is a U.S. defense-technology company founded in 2022 that
  builds advanced sensing and detection systems for military, border, and
  critical-infrastructure defense. Its Coherent Distributed Networks (CDN)
  technology powers a multi-product portfolio - including the Vanquish radar
  for early warning and tracking of unmanned aerial systems and missile
  threats, and HYDRA, a software-defined multi-application platform for
  detection, communications, and electronic effects. CHAOS markets domain
  dominance through counter-drone (counter-UAS) radar that detects threats up
  to ten minutes faster and tracks targets to 250 km. The company has raised
  roughly $1 billion from investors including 8VC, Accel, Valor Equity
  Partners, and NEA, with offices in Los Angeles, Washington DC, San
  Francisco, San Diego, London, and Amman. This profile was added to the API
  Evangelist network as a portfolio-company lead; CHAOS publishes a marketing
  and newsroom presence but no public developer API, documentation, or SDKs.
